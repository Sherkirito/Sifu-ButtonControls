; Sifu Button Controls bundled loader profile.
; OptiScaler binary is unmodified. This INI enables ASI loading and disables
; upscaler inputs, frame generation, spoofing and the OptiScaler overlay.

[Inputs]
EnableDlssInputs=false
EnableXeSSInputs=false
EnableFsr2Inputs=false
EnableFsr3Inputs=false
EnableFfxInputs=false
EnableHotSwapping=false

[FrameGen]
Enabled=false

[Spoofing]
Dxgi=false
Vulkan=false
StreamlineSpoofing=false

[Menu]
OverlayMenu=false
DisableSplash=true
ShowFps=false

[Plugins]
Path=auto
LoadAsiPlugins=true
LoadSpecialK=false
LoadReshade=false

[fakenvapi]
UseFakenvapi=false

[Log]
LogLevel=2
LogToFile=true
